name: Validate PR

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/**"
      - "registry/schema/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/validate-pr.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Validate package manifests
        run: node scripts/validate.mjs
