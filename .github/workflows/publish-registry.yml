name: Publish Registry

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "registry/schema/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/publish-registry.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Regenerate registry shards
        run: node scripts/publish-registry.mjs

      - name: Commit + push regenerated registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry/
          if git diff --cached --quiet; then
            echo "No registry changes to commit."
            exit 0
          fi
          git commit -m "chore(registry): regenerate shards"
          git push
